<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115學年度 第一學期 線上選社志願序</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root{
            --primary: #4B6339;
            --primary-dark: #374B28;
            --bg-color: #F4F6F0;
            --card-bg: #FFFFFF;
            --accent: #D98E2B;
            --text-main: #2C3527;
            --text-sub: #6C7A63;
        }
        *{ font-family: "Noto Sans TC", sans-serif; }
        body{ background-color: var(--bg-color); color: var(--text-main); }

        .banner-header {
            background: linear-gradient(135deg, #F0F4EC 0%, #E2EAD8 100%);
            border: 2px solid #C2D1B7;
            border-radius: 20px;
            color: var(--text-main);
            padding: 24px 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(61,83,43,0.08);
        }

        .trail-container {
            display: flex; flex-direction: row; align-items: center; justify-content: center;
            gap: 12px; margin: 24px 0;
        }
        .trail-step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .trail-dot {
            width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 14px; border: 2px solid #C2D1B7; background: #FFF; color: var(--text-sub); font-weight: 700; transition: .2s ease;
        }
        .trail-dot.active { background: var(--primary); border-color: var(--primary); color: #FFF; }
        .trail-dot.done { background: #8CA07B; border-color: #8CA07B; color: #FFF; }
        .trail-label { font-size: 13px; color: var(--text-sub); font-weight: 700; }
        .trail-label.active { color: var(--primary); }
        .trail-line { flex: 1; max-width: 48px; height: 3px; background: #C2D1B7; border-radius: 2px; margin-bottom: 20px; }
        .trail-line.done { background: #8CA07B; }

        .class-btn {
            background: var(--primary); color: white; border-radius: 16px;
            padding: 22px 10px; font-size: 1.4rem; font-weight: 800;
            box-shadow: 0 4px 12px rgba(75,99,57,0.2); transition: .15s ease;
        }
        .class-btn:hover { background: var(--primary-dark); }
        .class-btn:active { transform: scale(0.97); }

        .student-card {
            background: #FBF9F1; border: 2px solid #E5DEC9;
            border-radius: 16px; padding: 18px 10px; text-align: center;
            cursor: pointer; transition: .15s ease;
        }
        .student-card:hover { border-color: var(--primary); background: #FFF; }
        .student-card:active { transform: scale(0.97); }

        .club-row {
            background: #FFF; border: 1.5px solid #E2E8DC; border-left: 6px solid #D1DBC8;
            border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .club-row.rank-1 { border-left-color: #D98E2B; }
        .club-row.rank-2 { border-left-color: #4B6339; }
        .club-row.rank-3 { border-left-color: #5B82A6; }

        .rank-select {
            background: #FFF; border: 1.5px solid var(--accent); color: #A8631C;
            font-weight: 800; font-size: 14px; border-radius: 10px; padding: 6px 10px;
        }
        .info-chip {
            background: var(--accent); color: #FFF; font-weight: 700; font-size: 12px;
            padding: 6px 12px; border-radius: 8px; transition: .2s;
        }
        .info-chip:hover { background: #B3711E; }

        .btn-submit {
            background: var(--primary); color: white; font-weight: 900; font-size: 1.1rem;
            padding: 16px; border-radius: 16px; box-shadow: 0 4px 14px rgba(75,99,57,0.25);
        }
        .btn-submit:hover { background: var(--primary-dark); }

        .status-box { border: 2px dashed #C2D1B7; border-radius: 14px; padding: 24px; text-align: center; color: var(--text-sub); }
        .status-box.error { border-color: #E2A082; background: #FDF4F0; color: #B04A22; }

        .fixed-club-card {
            background: #FEF8EC; border: 2px solid #E6A13B;
            border-radius: 16px; padding: 24px 16px; text-align: center;
        }
    </style>
</head>
<body class="py-6 px-4">
    <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-xl p-5 sm:p-7">
        
        <!-- 頂部 Banner -->
        <div class="banner-header">
            <img id="schoolLogo" src="logo.png" alt="學校Logo" class="mx-auto h-16 mb-3 object-contain" onerror="this.style.display='none'">
            <h2 class="text-xl sm:text-2xl font-black tracking-wide text-emerald-950">115學年度 第一學期</h2>
            <h3 class="text-sm sm:text-base font-bold text-emerald-800 mt-1">線上選社志願序</h3>
        </div>

        <!-- 橫向步驟列 -->
        <div class="trail-container" id="trail">
            <div class="trail-step">
                <div class="trail-dot active" id="dotClass">1</div>
                <span class="trail-label active" id="labelClass">選班級</span>
            </div>
            <div class="trail-line" id="lineOne"></div>
            <div class="trail-step">
                <div class="trail-dot" id="dotStudent">2</div>
                <span class="trail-label" id="labelStudent">選同學</span>
            </div>
            <div class="trail-line" id="lineTwo"></div>
            <div class="trail-step">
                <div class="trail-dot" id="dotClub">3</div>
                <span class="trail-label" id="labelClub">排志願</span>
            </div>
        </div>

        <!-- 步驟 1：選擇班級 -->
        <div id="stepClass">
            <h3 class="font-black text-center text-base mb-4 text-slate-700">請選擇班級</h3>
            <div id="classGrid" class="grid grid-cols-2 gap-4">
                <div class="status-box col-span-2">📡 資料載入中，請稍候…</div>
            </div>
        </div>

        <!-- 步驟 2：選擇學生卡片 (含上一步按鈕) -->
        <div id="stepStudent" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <button onclick="backToClassStep()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-3 py-1.5 rounded-lg border border-slate-300 transition flex items-center gap-1">
                    ⬅️ 上一步 (選班級)
                </button>
                <h3 id="selectedClassTitle" class="font-black text-base text-slate-700"></h3>
                <div class="w-12"></div>
            </div>
            <div id="studentGrid" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- 步驟 3：社團選擇區 -->
        <div id="stepClub" class="hidden">
            <div class="bg-emerald-50/60 border border-emerald-100 rounded-2xl p-4 mb-4">
                <div class="flex justify-between items-center mb-1">
                    <span id="studentInfo" class="font-bold text-lg text-emerald-950"></span>
                    <button onclick="restartProcess()" class="text-xs bg-white border border-emerald-200 text-emerald-800 font-bold px-3 py-1 rounded-lg hover:bg-emerald-100 transition">重新選擇</button>
                </div>
                <span id="levelBadge" class="inline-block bg-emerald-700 text-white font-bold text-xs px-3 py-0.5 rounded-full"></span>
            </div>

            <!-- 校隊鎖定區 -->
            <div id="fixedClubNotice" class="hidden mb-6">
                <div class="fixed-club-card">
                    <div class="text-4xl mb-2">🏆</div>
                    <h4 class="font-black text-amber-900 text-lg mb-1">您已由學校指定為校隊成員</h4>
                    <p class="text-amber-800 font-black text-2xl my-3" id="fixedClubName"></p>
                    <p class="text-xs text-amber-700 mt-2 mb-4">📌 校隊成員免填其他志願，請點擊下方按鈕確認送出紀錄。</p>
                    <button onclick="submitData()" class="w-full btn-submit bg-amber-600 hover:bg-amber-700 text-white">
                        確認校隊名額並送出
                    </button>
                </div>
            </div>

            <!-- 一般學生填寫區 -->
            <div id="normalClubArea">
                <p class="text-xs text-slate-500 mb-3 text-center">💡 請為每個社團選擇志願序號（數字 1 為第一志願），點擊 ℹ️ 可查看簡介</p>
                <div id="clubList" class="space-y-3 mb-6"></div>
                <button onclick="submitData()" class="w-full btn-submit">
                    提交 / 更新志願
                </button>
            </div>
        </div>

        <footer class="text-center text-slate-400 text-xs mt-8 font-medium">製作人：TATA</footer>
    </div>

    <!-- 簡介彈出視窗 -->
    <div id="descModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 id="modalTitle" class="text-xl font-bold mb-3 border-b pb-2 text-slate-800"></h3>
            <p id="modalDesc" class="text-sm leading-relaxed mb-6 text-slate-600 whitespace-pre-line"></p>
            <button onclick="closeModal()" class="w-full bg-emerald-800 text-white font-bold py-2.5 rounded-xl hover:bg-emerald-900 transition">
                了解，關閉視窗
            </button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwysSOartamBcSLu63YM0ZDVBHF9SU4ZhjA3yCYXK302LTvAtgRLqh4xEiP0yhHcxZxHg/exec";

        let allStudents = [];
        let allClubs = [];
        let existingRecords = {};
        let currentStudent = null;
        let currentFilteredClubs = [];

        window.onload = () => { loadData(); };

        async function loadData() {
            const classGrid = document.getElementById('classGrid');
            classGrid.innerHTML = '<div class="status-box col-span-2">📡 資料載入中，請稍候…</div>';

            try {
                const res = await fetch(GAS_URL, { redirect: 'follow' });
                if (!res.ok) throw new Error('伺服器回應錯誤（狀態碼 ' + res.status + '）');

                let data = await res.json();
                allStudents = data.students || [];
                allClubs = data.clubs || [];
                existingRecords = data.existingRecords || {};

                if (allStudents.length === 0) {
                    classGrid.innerHTML = '<div class="status-box col-span-2">目前查無學生名單<br><button class="mt-2 text-xs bg-emerald-700 text-white px-3 py-1 rounded" onclick="loadData()">重新載入</button></div>';
                    return;
                }

                renderClasses();
            } catch (e) {
                console.error(e);
                classGrid.innerHTML = '<div class="status-box error col-span-2">⚠️ 資料載入失敗<br>Failed to fetch (請檢查 GAS 部署權限)<br><button class="mt-2 text-xs bg-red-600 text-white px-3 py-1 rounded" onclick="loadData()">重新載入</button></div>';
            }
        }

        function setTrail(step) {
            const dots = { 1: 'dotClass', 2: 'dotStudent', 3: 'dotClub' };
            const labels = { 1: 'labelClass', 2: 'labelStudent', 3: 'labelClub' };
            [1, 2, 3].forEach(i => {
                const dot = document.getElementById(dots[i]);
                const label = document.getElementById(labels[i]);
                dot.classList.remove('active', 'done');
                label.classList.remove('active');
                if (i < step) dot.classList.add('done');
                else if (i === step) { dot.classList.add('active'); label.classList.add('active'); }
            });
            document.getElementById('lineOne').classList.toggle('done', step > 1);
            document.getElementById('lineTwo').classList.toggle('done', step > 2);
        }

        function renderClasses() {
            const classGrid = document.getElementById('classGrid');
            const classes = [...new Set(allStudents.map(s => s.className))];

            classGrid.innerHTML = '';
            if (classes.length === 0) {
                classGrid.innerHTML = '<div class="status-box col-span-2">目前查無班級資料</div>';
                return;
            }

            classes.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "class-btn active:scale-95";
                btn.innerText = c;
                btn.onclick = () => selectClass(c);
                classGrid.appendChild(btn);
            });
        }

        function selectClass(c) {
            document.getElementById('stepClass').classList.add('hidden');
            document.getElementById('stepStudent').classList.remove('hidden');
            document.getElementById('selectedClassTitle').innerText = `${c} 班學生名單`;
            setTrail(2);
            renderStudents(c);
        }

        function backToClassStep() {
            document.getElementById('stepStudent').classList.add('hidden');
            document.getElementById('stepClass').classList.remove('hidden');
            setTrail(1);
        }

        function renderStudents(c) {
            const studentGrid = document.getElementById('studentGrid');
            const students = allStudents.filter(s => s.className === c);

            studentGrid.innerHTML = '';
            if (students.length === 0) {
                studentGrid.innerHTML = '<div class="status-box col-span-2">這個班級目前沒有學生資料</div>';
                return;
            }
            students.forEach(s => {
                const card = document.createElement('div');
                card.className = "student-card";
                card.onclick = () => selectStudent(s);
                
                const fixedBadge = s.fixedClub ? `<span class="inline-block bg-amber-100 text-amber-800 text-[10px] font-bold px-1.5 py-0.5 rounded mt-1">校隊成員</span>` : '';
                card.innerHTML = `
                    <div class="text-slate-400 font-medium text-sm mb-0.5">${s.seatNumber}號</div>
                    <div class="text-slate-800 font-bold text-2xl">${s.name}</div>
                    ${fixedBadge}
                `;
                studentGrid.appendChild(card);
            });
        }

        function selectStudent(student) {
            currentStudent = student;
            document.getElementById('stepStudent').classList.add('hidden');
            document.getElementById('stepClub').classList.remove('hidden');
            setTrail(3);

            document.getElementById('studentInfo').innerText = `${student.className}班 ${student.seatNumber}號 ${student.name}`;
            document.getElementById('levelBadge').innerText = student.level;

            if (student.fixedClub && student.fixedClub.trim() !== "") {
                document.getElementById('fixedClubNotice').classList.remove('hidden');
                document.getElementById('normalClubArea').classList.add('hidden');
                document.getElementById('fixedClubName').innerText = student.fixedClub;
            } else {
                document.getElementById('fixedClubNotice').classList.add('hidden');
                document.getElementById('normalClubArea').classList.remove('hidden');

                // 抓取年級數字 (例如 101 取出 '1', 202 取出 '2')
                const studentGrade = student.className.charAt(0);

                const studentKey = `${student.className}_${student.seatNumber}`;
                const pastRecord = existingRecords[studentKey] || {};

                // 過濾：學段符合 且 (無年級限制 或 年級限定符合)
                const clubsForLevel = allClubs.filter(c => {
                    const isLevelMatch = c.target === student.level;
                    const isGradeMatch = !c.gradeLimit || c.gradeLimit === "" || c.gradeLimit === studentGrade;
                    return isLevelMatch && isGradeMatch;
                });

                currentFilteredClubs = clubsForLevel.map((club, idx) => {
                    const savedRank = pastRecord[club.name] ? parseInt(pastRecord[club.name]) : (idx + 1);
                    return { ...club, rank: savedRank };
                });

                renderClubs();
            }
        }

        function renderClubs() {
            const clubListEl = document.getElementById('clubList');
            clubListEl.innerHTML = '';

            if (currentFilteredClubs.length === 0) {
                clubListEl.innerHTML = '<div class="status-box">這個年段目前查無社團資料</div>';
                return;
            }

            const totalClubs = currentFilteredClubs.length;
            currentFilteredClubs.sort((a, b) => a.rank - b.rank);

            currentFilteredClubs.forEach((club) => {
                const item = document.createElement('div');
                const rankClass = club.rank === 1 ? 'rank-1' : club.rank === 2 ? 'rank-2' : club.rank === 3 ? 'rank-3' : '';
                item.className = `club-row ${rankClass}`;

                const shortDesc = club.desc ? (club.desc.length > 12 ? club.desc.substring(0, 12) + "..." : club.desc) : "點擊查看詳情";

                let optionsHtml = '';
                for (let i = 1; i <= totalClubs; i++) {
                    const selected = (i === club.rank) ? 'selected' : '';
                    optionsHtml += `<option value="${i}" ${selected}>第 ${i} 志願</option>`;
                }

                item.innerHTML = `
                    <div class="flex items-center space-x-2 overflow-hidden flex-1">
                        <select onchange="changeRank('${club.id}', this.value)" class="rank-select">
                            ${optionsHtml}
                        </select>
                        <div class="truncate">
                            <span class="font-bold text-slate-800 text-sm sm:text-base">[${club.id}] ${club.name}</span>
                            <p class="text-xs text-slate-500 truncate">${shortDesc}</p>
                        </div>
                    </div>
                    <button onclick="showModal('${club.name}', \`${club.desc}\`)" class="info-chip flex-shrink-0">
                        ℹ️ 簡介
                    </button>
                `;
                clubListEl.appendChild(item);
            });
        }

        function changeRank(clubId, newRank) {
            newRank = parseInt(newRank);
            const targetClub = currentFilteredClubs.find(c => c.id === clubId);
            const oldRank = targetClub.rank;

            if (oldRank === newRank) return;

            const replacedClub = currentFilteredClubs.find(c => c.rank === newRank);
            if (replacedClub) {
                replacedClub.rank = oldRank;
            }
            targetClub.rank = newRank;

            renderClubs();
        }

        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc || "暫無詳細簡介。";
            document.getElementById('descModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('descModal').classList.add('hidden');
        }

        function restartProcess() {
            document.getElementById('stepClub').classList.add('hidden');
            document.getElementById('stepStudent').classList.add('hidden');
            document.getElementById('stepClass').classList.remove('hidden');
            setTrail(1);
            currentStudent = null;
        }

        async function submitData() {
            if (!currentStudent) return;

            const isFixed = currentStudent.fixedClub && currentStudent.fixedClub.trim() !== "";

            const payload = {
                className: currentStudent.className,
                seatNumber: currentStudent.seatNumber,
                studentName: currentStudent.name,
                level: currentStudent.level,
                fixedClub: isFixed ? currentStudent.fixedClub : "",
                preferences: isFixed ? [] : currentFilteredClubs.map(c => ({
                    clubName: c.name,
                    rank: c.rank
                }))
            };

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert(isFixed ? '校隊名額已成功確認並寫入資料庫！' : '志願提交/更新成功！已寫入資料庫。');

            } catch (e) {
                alert('提交失敗：' + e);
            }
        }
    </script>
</body>
</html>
