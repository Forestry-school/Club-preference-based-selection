<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115學年度 第一學期 線上選社志願序</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root{
            --olive:#5F7A4C;
            --olive-dark:#4B6339;
            --sage-bg:#E9EFE1;
            --cream:#FBF7EC;
            --tan-line:#E4D9C0;
            --ink:#2B2B28;
            --ink-soft:#8A8A83;
            --amber:#D98E2B;
        }
        *{ font-family:"Noto Sans TC", sans-serif; }
        body{ background: var(--sage-bg); color: var(--ink); }

        header.top-bar{
            background:#fff;
            border-bottom:1px solid #E4E4DC;
            padding: 14px 16px;
            text-align:center;
        }
        header.top-bar h1{ font-size:15px; font-weight:900; color:var(--ink); }

        .page-card{
            background: var(--sage-bg);
            max-width: 640px;
            margin: 0 auto;
            padding: 18px 16px 40px;
        }

        .logo-block{ text-align:center; margin: 10px 0 14px; }
        .logo-block h2{ font-size:19px; font-weight:900; color:var(--ink); }
        .logo-block h3{ font-size:15px; font-weight:700; color:var(--ink-soft); margin-top:2px; }

        /* trail */
        .trail{ display:flex; align-items:center; justify-content:center; gap:6px; margin: 14px 0 20px; }
        .trail-step{ display:flex; flex-direction:column; align-items:center; gap:5px; }
        .trail-dot{
            width:34px; height:34px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:14px; border:2px solid #DCE3D3; background:#fff;
            color: var(--ink-soft); font-weight:700; transition:.2s ease;
        }
        .trail-dot.active{ background: var(--olive); border-color: var(--olive); color:#fff; }
        .trail-dot.done{ background:#A9BF97; border-color:#A9BF97; color:#fff; }
        .trail-label{ font-size:11px; color:var(--ink-soft); font-weight:700; }
        .trail-label.active{ color:var(--olive); }
        .trail-line{ width:28px; height:2px; background:#DCE3D3; border-radius:2px; margin-bottom:19px; }
        .trail-line.done{ background:#A9BF97; }

        h3.section-title{ font-weight:900; color:var(--ink); text-align:center; font-size:15px; }

        /* class buttons */
        .class-btn{
            background: var(--olive);
            color:#fff;
            border-radius: 16px;
            padding: 26px 10px;
            font-size: 1.5rem;
            font-weight: 800;
            box-shadow: 0 4px 10px -4px rgba(0,0,0,.15);
            border:none;
            transition:.15s ease;
        }
        .class-btn:hover{ background: var(--olive-dark); }
        .class-btn:active{ transform: scale(.97); }

        /* student cards */
        .student-card{
            background: var(--cream);
            border: 1.5px solid var(--tan-line);
            border-radius: 16px;
            padding: 20px 10px 18px;
            text-align:center;
            cursor:pointer;
            transition:.15s ease;
        }
        .student-card:hover{ border-color: var(--olive); }
        .student-card:active{ transform: scale(.97); }
        .seat-label{ color: var(--ink-soft); font-size: 15px; font-weight:500; margin-bottom:6px; }
        .student-name{ color: var(--ink); font-weight:800; font-size:1.5rem; }

        /* club selection panel */
        .info-banner{
            background:#fff;
            border: 1px solid #E4E4DC;
            border-radius: 14px;
            padding: 14px 16px;
        }
        .level-badge{
            display:inline-block; background: var(--olive); color:#fff;
            font-weight:800; font-size:11.5px; padding:3px 10px; border-radius:999px;
        }
        .btn-ghost{
            background:#fff; border:1px solid #DADAD0; color: var(--ink-soft);
            font-size:12px; font-weight:700; padding:6px 10px; border-radius:10px;
        }
        .btn-ghost:hover{ background: var(--sage-bg); }

        .club-row{
            background: #fff;
            border: 1px solid #E4E4DC;
            border-left: 5px solid #E4E4DC;
            border-radius: 14px;
            padding: 10px 12px;
            display:flex; align-items:center; justify-content:space-between; gap:10px;
        }
        .club-row.rank-1{ border-left-color: var(--amber); }
        .club-row.rank-2{ border-left-color: var(--olive); }
        .club-row.rank-3{ border-left-color: #8AA9C9; }

        .rank-select{
            background:#fff; border:1.5px solid var(--amber); color: #A8631C;
            font-weight:800; font-size:13px; border-radius:10px; padding:8px 8px;
        }
        .rank-select:focus{ outline:2px solid var(--amber); outline-offset:1px; }

        .club-name{ color: var(--ink); font-weight:800; }
        .club-desc{ color: var(--ink-soft); }

        .info-chip{
            background: var(--amber); color:#fff; font-weight:700; font-size:11.5px;
            padding: 6px 10px; border-radius:10px; white-space:nowrap;
        }
        .info-chip:hover{ background:#A8631C; }

        .btn-submit{
            background: var(--olive);
            color:#fff; font-weight:900; font-size:1.05rem;
            padding: 15px; border-radius:16px;
        }
        .btn-submit:hover{ background: var(--olive-dark); }
        .btn-submit:active{ transform: scale(.98); }

        /* modal */
        #descModal .modal-card{
            background: #fff; border-radius: 18px; border:1px solid #E4E4DC;
        }
        #modalTitle{ color: var(--ink); }
        .btn-close{ background: var(--olive); color:#fff; font-weight:800; }
        .btn-close:hover{ background: var(--olive-dark); }

        /* status / error states */
        .status-box{
            border: 1.5px dashed #DADAD0; border-radius:14px; padding: 26px 16px;
            text-align:center; color: var(--ink-soft); font-size:13.5px;
        }
        .status-box.error{ border-color:#E3B7A1; background:#FCF1EA; color:#9C4A24; }
        .status-box .retry-btn{
            margin-top:12px; background: var(--olive); color:#fff; font-weight:700;
            font-size:13px; padding:8px 16px; border-radius:10px; display:inline-block;
        }

        footer.credit{ text-align:center; color: var(--ink-soft); font-size:11.5px; margin-top:26px; }

        @media (prefers-reduced-motion: reduce){ .class-btn, .student-card{ transition:none; } }
    </style>
</head>
<body>
    <header class="top-bar">
        <h1>國小社團選填系統</h1>
    </header>

    <div class="page-card">
        <div class="logo-block">
            <img id="schoolLogo" src="logo.png" alt="學校Logo" class="mx-auto h-14 mb-2 object-contain" onerror="this.style.display='none'">
            <h2>115學年度 第一學期</h2>
            <h3>線上選社志願序</h3>
        </div>

        <!-- 步驟軌跡 -->
        <div class="trail" id="trail">
            <div class="trail-step">
                <div class="trail-dot active" id="dotClass">1</div>
                <span class="trail-label active" id="labelClass">選班級</span>
            </div>
            <div class="trail-line" id="lineOne"></div>
            <div class="trail-step">
                <div class="trail-dot" id="dotStudent">2</div>
                <span class="trail-label" id="labelStudent">選同學</span>
            </div>
            <div class="trail-line" id="lineTwo"></div>
            <div class="trail-step">
                <div class="trail-dot" id="dotClub">3</div>
                <span class="trail-label" id="labelClub">排志願</span>
            </div>
        </div>

        <!-- 步驟 1：選擇班級 -->
        <div id="stepClass">
            <h3 class="section-title mb-4">請選擇班級</h3>
            <div id="classGrid" class="grid grid-cols-2 gap-4">
                <div class="status-box col-span-2">📡 資料載入中，請稍候…</div>
            </div>
        </div>

        <!-- 步驟 2：選擇學生卡片 -->
        <div id="stepStudent" class="hidden">
            <div class="text-center mb-4">
                <h3 id="selectedClassTitle" class="section-title"></h3>
            </div>
            <div id="studentGrid" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- 步驟 3：社團選擇區 -->
        <div id="stepClub" class="hidden">
            <div class="info-banner mb-4">
                <div class="flex justify-between items-center mb-1">
                    <span id="studentInfo" class="font-bold text-lg"></span>
                    <button onclick="restartProcess()" class="btn-ghost">重新選擇</button>
                </div>
                <span id="levelBadge" class="level-badge"></span>
            </div>

            <p class="text-xs mb-3 text-center" style="color:var(--ink-soft)">💡 請為每個社團選擇志願序號（數字 1 為第一志願），點擊 ℹ️ 可查看簡介</p>

            <div id="clubList" class="space-y-3 mb-6"></div>

            <button onclick="submitData()" class="w-full btn-submit">
                提交 / 更新志願
            </button>
        </div>

        <footer class="credit">國小社團選填系統</footer>
    </div>

    <!-- 彈出視窗 (社團簡介 Dialog) -->
    <div id="descModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="modal-card max-w-md w-full p-6 shadow-2xl">
            <h3 id="modalTitle" class="text-xl font-bold mb-3 border-b pb-2" style="border-color:#E4E4DC"></h3>
            <p id="modalDesc" class="text-sm leading-relaxed mb-6 whitespace-pre-line" style="color:var(--ink-soft)"></p>
            <button onclick="closeModal()" class="w-full btn-close py-2.5 rounded-xl transition">
                了解，關閉視窗
            </button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwysSOartamBcSLu63YM0ZDVBHF9SU4ZhjA3yCYXK302LTvAtgRLqh4xEiP0yhHcxZxHg/exec";

        let allStudents = [];
        let allClubs = [];
        let existingRecords = {};
        let currentStudent = null;
        let currentFilteredClubs = [];

        window.onload = () => { loadData(); };

        async function loadData() {
            const classGrid = document.getElementById('classGrid');
            classGrid.innerHTML = '<div class="status-box col-span-2">📡 資料載入中，請稍候…</div>';

            if (!GAS_URL) {
                classGrid.innerHTML = '<div class="status-box error col-span-2">尚未設定資料來源網址（GAS_URL）</div>';
                return;
            }

            try {
                const res = await fetch(GAS_URL);
                if (!res.ok) throw new Error('伺服器回應錯誤（狀態碼 ' + res.status + '）');

                let data;
                try {
                    data = await res.json();
                } catch (parseErr) {
                    throw new Error('回傳的內容不是有效的資料格式，請確認 Apps Script 部署設定（存取權限需為「所有人」）');
                }

                allStudents = data.students || [];
                allClubs = data.clubs || [];
                existingRecords = data.existingRecords || {};

                if (allStudents.length === 0) {
                    classGrid.innerHTML = '<div class="status-box col-span-2">目前查無學生名單，請確認 Google 試算表「學生名單」工作表是否已填入資料<br><span class="retry-btn" onclick="loadData()">重新載入</span></div>';
                    return;
                }

                renderClasses();
            } catch (e) {
                console.error(e);
                classGrid.innerHTML =
                    '<div class="status-box error col-span-2">⚠️ 資料載入失敗<br>' +
                    (e.message || '請檢查網路連線') +
                    '<br><span class="retry-btn" onclick="loadData()">重新載入</span></div>';
            }
        }

        function setTrail(step) {
            const dots = { 1: 'dotClass', 2: 'dotStudent', 3: 'dotClub' };
            const labels = { 1: 'labelClass', 2: 'labelStudent', 3: 'labelClub' };
            [1, 2, 3].forEach(i => {
                const dot = document.getElementById(dots[i]);
                const label = document.getElementById(labels[i]);
                dot.classList.remove('active', 'done');
                label.classList.remove('active');
                if (i < step) dot.classList.add('done');
                else if (i === step) { dot.classList.add('active'); label.classList.add('active'); }
            });
            document.getElementById('lineOne').classList.toggle('done', step > 1);
            document.getElementById('lineTwo').classList.toggle('done', step > 2);
        }

        function renderClasses() {
            const classGrid = document.getElementById('classGrid');
            const classes = [...new Set(allStudents.map(s => s.className))];

            classGrid.innerHTML = '';
            if (classes.length === 0) {
                classGrid.innerHTML = '<div class="status-box col-span-2">目前查無班級資料</div>';
                return;
            }

            classes.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "class-btn active:scale-95";
                btn.innerText = c;
                btn.onclick = () => selectClass(c);
                classGrid.appendChild(btn);
            });
        }

        function selectClass(c) {
            document.getElementById('stepClass').classList.add('hidden');
            document.getElementById('stepStudent').classList.remove('hidden');
            document.getElementById('selectedClassTitle').innerText = `${c} 班學生名單`;
            setTrail(2);
            renderStudents(c);
        }

        function renderStudents(c) {
            const studentGrid = document.getElementById('studentGrid');
            const students = allStudents.filter(s => s.className === c);

            studentGrid.innerHTML = '';
            if (students.length === 0) {
                studentGrid.innerHTML = '<div class="status-box col-span-2">這個班級目前沒有學生資料</div>';
                return;
            }
            students.forEach(s => {
                const card = document.createElement('div');
                card.className = "student-card";
                card.onclick = () => selectStudent(s);
                card.innerHTML = `
                    <div class="seat-label">${s.seatNumber}號</div>
                    <div class="student-name">${s.name}</div>
                `;
                studentGrid.appendChild(card);
            });
        }

        function selectStudent(student) {
            currentStudent = student;
            document.getElementById('stepStudent').classList.add('hidden');
            document.getElementById('stepClub').classList.remove('hidden');
            setTrail(3);

            document.getElementById('studentInfo').innerText = `${student.className}班 ${student.seatNumber}號 ${student.name}`;
            document.getElementById('levelBadge').innerText = student.level;

            const studentKey = `${student.className}_${student.seatNumber}`;
            const pastRecord = existingRecords[studentKey] || {};

            const clubsForLevel = allClubs.filter(c => c.target === student.level);

            currentFilteredClubs = clubsForLevel.map((club, idx) => {
                const savedRank = pastRecord[club.name] ? parseInt(pastRecord[club.name]) : (idx + 1);
                return {
                    ...club,
                    rank: savedRank
                };
            });

            renderClubs();
        }

        function renderClubs() {
            const clubListEl = document.getElementById('clubList');
            clubListEl.innerHTML = '';

            if (currentFilteredClubs.length === 0) {
                clubListEl.innerHTML = '<div class="status-box">這個年段目前查無社團資料，請確認「社團資料」工作表的「適用對象」欄位是否正確</div>';
                return;
            }

            const totalClubs = currentFilteredClubs.length;
            currentFilteredClubs.sort((a, b) => a.rank - b.rank);

            currentFilteredClubs.forEach((club) => {
                const item = document.createElement('div');
                const rankClass = club.rank === 1 ? 'rank-1' : club.rank === 2 ? 'rank-2' : club.rank === 3 ? 'rank-3' : '';
                item.className = `club-row ${rankClass}`;

                const shortDesc = club.desc ? (club.desc.length > 12 ? club.desc.substring(0, 12) + "..." : club.desc) : "點擊查看詳情";

                let optionsHtml = '';
                for (let i = 1; i <= totalClubs; i++) {
                    const selected = (i === club.rank) ? 'selected' : '';
                    optionsHtml += `<option value="${i}" ${selected}>第 ${i} 志願</option>`;
                }

                item.innerHTML = `
                    <div class="flex items-center space-x-2 overflow-hidden flex-1">
                        <select onchange="changeRank('${club.id}', this.value)" class="rank-select">
                            ${optionsHtml}
                        </select>
                        <div class="truncate">
                            <span class="club-name text-sm sm:text-base">[${club.id}] ${club.name}</span>
                            <p class="club-desc text-xs truncate">${shortDesc}</p>
                        </div>
                    </div>
                    <button onclick="showModal('${club.name}', \`${club.desc}\`)" class="info-chip flex-shrink-0">
                        ℹ️ 簡介
                    </button>
                `;
                clubListEl.appendChild(item);
            });
        }

        function changeRank(clubId, newRank) {
            newRank = parseInt(newRank);
            const targetClub = currentFilteredClubs.find(c => c.id === clubId);
            const oldRank = targetClub.rank;

            if (oldRank === newRank) return;

            const replacedClub = currentFilteredClubs.find(c => c.rank === newRank);
            if (replacedClub) {
                replacedClub.rank = oldRank;
            }
            targetClub.rank = newRank;

            renderClubs();
        }

        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc || "暫無詳細簡介。";
            document.getElementById('descModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('descModal').classList.add('hidden');
        }

        function restartProcess() {
            document.getElementById('stepClub').classList.add('hidden');
            document.getElementById('stepStudent').classList.add('hidden');
            document.getElementById('stepClass').classList.remove('hidden');
            setTrail(1);
            currentStudent = null;
        }

        async function submitData() {
            if (!currentStudent) return;

            const preferencesPayload = currentFilteredClubs.map(c => ({
                clubName: c.name,
                rank: c.rank
            }));

            const payload = {
                className: currentStudent.className,
                seatNumber: currentStudent.seatNumber,
                studentName: currentStudent.name,
                level: currentStudent.level,
                preferences: preferencesPayload
            };

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('志願提交/更新成功！已寫入資料庫。');

                const studentKey = `${currentStudent.className}_${currentStudent.seatNumber}`;
                if (!existingRecords[studentKey]) existingRecords[studentKey] = {};
                currentFilteredClubs.forEach(c => {
                    existingRecords[studentKey][c.name] = c.rank;
                });

            } catch (e) {
                alert('提交失敗：' + e);
            }
        }
    </script>
</body>
</html>
