<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115學年度 第一學期 線上選社志願序</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        *{ font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; }
        body{ background: #F8FAFC; color: #0F172A; }

        .trail-dot {
            width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; border: 2px solid #E2E8F0; background: #FFF;
            color: #94A3B8; font-weight: 700; transition: .2s ease;
        }
        .trail-dot.active { background: #2563EB; border-color: #2563EB; color: #FFF; box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
        .trail-dot.done { background: #60A5FA; border-color: #60A5FA; color: #FFF; }
        .trail-label { font-size: 12px; color: #94A3B8; font-weight: 700; }
        .trail-label.active { color: #2563EB; }
        .trail-line { width: 32px; height: 2px; background: #E2E8F0; border-radius: 2px; margin-bottom: 18px; }
        .trail-line.done { background: #60A5FA; }

        .class-btn {
            background: #2563EB; color: white; border-radius: 16px;
            padding: 22px 10px; font-size: 1.4rem; font-weight: 800;
            box-shadow: 0 8px 16px -4px rgba(37,99,235,0.25); transition: .15s ease;
        }
        .class-btn:hover { background: #1D4ED8; }
        .class-btn:active { transform: scale(0.97); }

        .student-card {
            background: #FFFFFF; border: 2px solid #F1F5F9;
            border-radius: 16px; padding: 18px 10px; text-align: center;
            cursor: pointer; transition: .15s ease; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .student-card:hover { border-color: #3B82F6; }
        .student-card:active { transform: scale(0.97); }

        .club-row {
            background: #FFF; border: 1px solid #E2E8F0; border-left: 5px solid #CBD5E1;
            border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .club-row.rank-1 { border-left-color: #2563EB; }
        .club-row.rank-2 { border-left-color: #0EA5E9; }
        .club-row.rank-3 { border-left-color: #6366F1; }

        .rank-select {
            background: #EFF6FF; border: 1.5px solid #93C5FD; color: #1E40AF;
            font-weight: 800; font-size: 14px; border-radius: 10px; padding: 6px 10px;
        }
        .info-chip {
            background: #3B82F6; color: #FFF; font-weight: 700; font-size: 12px;
            padding: 6px 12px; border-radius: 8px; transition: .2s;
        }
        .info-chip:hover { background: #1D4ED8; }

        .btn-submit {
            background: #2563EB; color: white; font-weight: 900; font-size: 1.1rem;
            padding: 16px; border-radius: 16px; box-shadow: 0 8px 20px -4px rgba(37,99,235,0.4);
        }
        .btn-submit:hover { background: #1D4ED8; }

        .status-box { border: 2px dashed #E2E8F0; border-radius: 14px; padding: 24px; text-align: center; color: #64748B; }
        .status-box.error { border-color: #FCA5A5; background: #FEF2F2; color: #991B1B; }
    </style>
</head>
<body class="py-8 px-4">
    <div class="max-w-xl mx-auto bg-white rounded-3xl shadow-2xl p-6 sm:p-8 border border-slate-100">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <img id="schoolLogo" src="logo.png" alt="學校Logo" class="mx-auto h-14 mb-3 object-contain" onerror="this.style.display='none'">
            <span class="bg-blue-50 text-blue-700 font-bold text-xs px-3 py-1 rounded-full uppercase tracking-wider">Online Club System</span>
            <h2 class="text-2xl font-extrabold text-slate-900 mt-2">115學年度 第一學期</h2>
            <h3 class="text-sm font-semibold text-slate-500 mt-0.5">線上選社志願序登記</h3>
        </div>

        <!-- 步驟軌跡 -->
        <div class="trail" id="trail">
            <div class="flex flex-col items-center gap-1">
                <div class="trail-dot active" id="dotClass">1</div>
                <span class="trail-label active" id="labelClass">選班級</span>
            </div>
            <div class="trail-line" id="lineOne"></div>
            <div class="flex flex-col items-center gap-1">
                <div class="trail-dot" id="dotStudent">2</div>
                <span class="trail-label" id="labelStudent">選同學</span>
            </div>
            <div class="trail-line" id="lineTwo"></div>
            <div class="flex flex-col items-center gap-1">
                <div class="trail-dot" id="dotClub">3</div>
                <span class="trail-label" id="labelClub">排志願</span>
            </div>
        </div>

        <!-- 步驟 1：選擇班級 -->
        <div id="stepClass">
            <h3 class="font-bold text-center text-sm text-slate-400 mb-4 uppercase tracking-wider">請選擇班級</h3>
            <div id="classGrid" class="grid grid-cols-2 gap-4">
                <div class="status-box col-span-2">📡 資料載入中，請稍候…</div>
            </div>
        </div>

        <!-- 步驟 2：選擇學生卡片 -->
        <div id="stepStudent" class="hidden">
            <div class="text-center mb-4">
                <h3 id="selectedClassTitle" class="font-bold text-center text-base text-slate-800"></h3>
            </div>
            <div id="studentGrid" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- 步驟 3：社團選擇區 -->
        <div id="stepClub" class="hidden">
            <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-4 mb-4">
                <div class="flex justify-between items-center mb-1">
                    <span id="studentInfo" class="font-extrabold text-lg text-blue-950"></span>
                    <button onclick="restartProcess()" class="text-xs bg-white text-blue-600 font-bold px-3 py-1 rounded-lg border border-blue-200 hover:bg-blue-100 transition">重新選擇</button>
                </div>
                <span id="levelBadge" class="inline-block bg-blue-600 text-white font-bold text-xs px-3 py-0.5 rounded-full"></span>
            </div>

            <p class="text-xs text-slate-400 mb-4 text-center">💡 請為每個社團選擇志願序號（數字 1 為第一志願），點擊 ℹ️ 可查看簡介</p>

            <div id="clubList" class="space-y-3 mb-6"></div>

            <button onclick="submitData()" class="w-full btn-submit">
                提交 / 更新志願
            </button>
        </div>

        <footer class="text-center text-slate-300 text-xs mt-8">國小社團選填系統</footer>
    </div>

    <!-- Modal -->
    <div id="descModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl">
            <h3 id="modalTitle" class="text-xl font-bold mb-3 border-b pb-2 text-slate-800"></h3>
            <p id="modalDesc" class="text-sm leading-relaxed mb-6 text-slate-600 whitespace-pre-line"></p>
            <button onclick="closeModal()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-2xl hover:bg-blue-700 transition">
                關閉視窗
            </button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwysSOartamBcSLu63YM0ZDVBHF9SU4ZhjA3yCYXK302LTvAtgRLqh4xEiP0yhHcxZxHg/exec";

        let allStudents = [];
        let allClubs = [];
        let existingRecords = {};
        let currentStudent = null;
        let currentFilteredClubs = [];

        window.onload = () => { loadData(); };

        async function loadData() {
            const classGrid = document.getElementById('classGrid');
            classGrid.innerHTML = '<div class="status-box col-span-2">📡 資料載入中，請稍候…</div>';

            if (!GAS_URL) {
                classGrid.innerHTML = '<div class="status-box error col-span-2">尚未設定資料來源網址（GAS_URL）</div>';
                return;
            }

            try {
                const res = await fetch(GAS_URL);
                if (!res.ok) throw new Error('伺服器回應錯誤（狀態碼 ' + res.status + '）');

                let data = await res.json();
                allStudents = data.students || [];
                allClubs = data.clubs || [];
                existingRecords = data.existingRecords || {};

                if (allStudents.length === 0) {
                    classGrid.innerHTML = '<div class="status-box col-span-2">目前查無學生名單<br><button class="mt-2 text-xs bg-blue-600 text-white px-3 py-1 rounded" onclick="loadData()">重新載入</button></div>';
                    return;
                }

                renderClasses();
            } catch (e) {
                classGrid.innerHTML = '<div class="status-box error col-span-2">⚠️ 資料載入失敗<br>' + (e.message || '請檢查網路連線') + '<br><button class="mt-2 text-xs bg-red-600 text-white px-3 py-1 rounded" onclick="loadData()">重新載入</button></div>';
            }
        }

        function setTrail(step) {
            const dots = { 1: 'dotClass', 2: 'dotStudent', 3: 'dotClub' };
            const labels = { 1: 'labelClass', 2: 'labelStudent', 3: 'labelClub' };
            [1, 2, 3].forEach(i => {
                const dot = document.getElementById(dots[i]);
                const label = document.getElementById(labels[i]);
                dot.classList.remove('active', 'done');
                label.classList.remove('active');
                if (i < step) dot.classList.add('done');
                else if (i === step) { dot.classList.add('active'); label.classList.add('active'); }
            });
            document.getElementById('lineOne').classList.toggle('done', step > 1);
            document.getElementById('lineTwo').classList.toggle('done', step > 2);
        }

        function renderClasses() {
            const classGrid = document.getElementById('classGrid');
            const classes = [...new Set(allStudents.map(s => s.className))];

            classGrid.innerHTML = '';
            classes.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "class-btn active:scale-95";
                btn.innerText = c;
                btn.onclick = () => selectClass(c);
                classGrid.appendChild(btn);
            });
        }

        function selectClass(c) {
            document.getElementById('stepClass').classList.add('hidden');
            document.getElementById('stepStudent').classList.remove('hidden');
            document.getElementById('selectedClassTitle').innerText = `${c} 班學生名單`;
            setTrail(2);
            renderStudents(c);
        }

        function renderStudents(c) {
            const studentGrid = document.getElementById('studentGrid');
            const students = allStudents.filter(s => s.className === c);

            studentGrid.innerHTML = '';
            students.forEach(s => {
                const card = document.createElement('div');
                card.className = "student-card";
                card.onclick = () => selectStudent(s);
                card.innerHTML = `
                    <div class="text-slate-400 font-semibold text-xs mb-1">${s.seatNumber}號</div>
                    <div class="text-slate-800 font-extrabold text-2xl">${s.name}</div>
                `;
                studentGrid.appendChild(card);
            });
        }

        function selectStudent(student) {
            currentStudent = student;
            document.getElementById('stepStudent').classList.add('hidden');
            document.getElementById('stepClub').classList.remove('hidden');
            setTrail(3);

            document.getElementById('studentInfo').innerText = `${student.className}班 ${student.seatNumber}號 ${student.name}`;
            document.getElementById('levelBadge').innerText = student.level;

            const studentKey = `${student.className}_${student.seatNumber}`;
            const pastRecord = existingRecords[studentKey] || {};

            const clubsForLevel = allClubs.filter(c => c.target === student.level);

            currentFilteredClubs = clubsForLevel.map((club, idx) => {
                const savedRank = pastRecord[club.name] ? parseInt(pastRecord[club.name]) : (idx + 1);
                return { ...club, rank: savedRank };
            });

            renderClubs();
        }

        function renderClubs() {
            const clubListEl = document.getElementById('clubList');
            clubListEl.innerHTML = '';

            const totalClubs = currentFilteredClubs.length;
            currentFilteredClubs.sort((a, b) => a.rank - b.rank);

            currentFilteredClubs.forEach((club) => {
                const item = document.createElement('div');
                const rankClass = club.rank === 1 ? 'rank-1' : club.rank === 2 ? 'rank-2' : club.rank === 3 ? 'rank-3' : '';
                item.className = `club-row ${rankClass}`;

                const shortDesc = club.desc ? (club.desc.length > 12 ? club.desc.substring(0, 12) + "..." : club.desc) : "點擊查看詳情";

                let optionsHtml = '';
                for (let i = 1; i <= totalClubs; i++) {
                    const selected = (i === club.rank) ? 'selected' : '';
                    optionsHtml += `<option value="${i}" ${selected}>第 ${i} 志願</option>`;
                }

                item.innerHTML = `
                    <div class="flex items-center space-x-2 overflow-hidden flex-1">
                        <select onchange="changeRank('${club.id}', this.value)" class="rank-select">
                            ${optionsHtml}
                        </select>
                        <div class="truncate">
                            <span class="font-bold text-slate-800 text-sm sm:text-base">[${club.id}] ${club.name}</span>
                            <p class="text-xs text-slate-400 truncate">${shortDesc}</p>
                        </div>
                    </div>
                    <button onclick="showModal('${club.name}', \`${club.desc}\`)" class="info-chip flex-shrink-0">
                        ℹ️ 簡介
                    </button>
                `;
                clubListEl.appendChild(item);
            });
        }

        function changeRank(clubId, newRank) {
            newRank = parseInt(newRank);
            const targetClub = currentFilteredClubs.find(c => c.id === clubId);
            const oldRank = targetClub.rank;

            if (oldRank === newRank) return;

            const replacedClub = currentFilteredClubs.find(c => c.rank === newRank);
            if (replacedClub) {
                replacedClub.rank = oldRank;
            }
            targetClub.rank = newRank;

            renderClubs();
        }

        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc || "暫無詳細簡介。";
            document.getElementById('descModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('descModal').classList.add('hidden');
        }

        function restartProcess() {
            document.getElementById('stepClub').classList.add('hidden');
            document.getElementById('stepStudent').classList.add('hidden');
            document.getElementById('stepClass').classList.remove('hidden');
            setTrail(1);
            currentStudent = null;
        }

        async function submitData() {
            if (!currentStudent) return;

            const preferencesPayload = currentFilteredClubs.map(c => ({
                clubName: c.name,
                rank: c.rank
            }));

            const payload = {
                className: currentStudent.className,
                seatNumber: currentStudent.seatNumber,
                studentName: currentStudent.name,
                level: currentStudent.level,
                preferences: preferencesPayload
            };

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('志願提交/更新成功！已寫入資料庫。');

                const studentKey = `${currentStudent.className}_${currentStudent.seatNumber}`;
                if (!existingRecords[studentKey]) existingRecords[studentKey] = {};
                currentFilteredClubs.forEach(c => {
                    existingRecords[studentKey][c.name] = c.rank;
                });

            } catch (e) {
                alert('提交失敗：' + e);
            }
        }
    </script>
</body>
</html>
