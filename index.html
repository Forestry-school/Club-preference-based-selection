<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生社團志願選填系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        .class-btn { background-color: #4d7c0f; color: white; }
        .class-btn:hover { background-color: #3f6212; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-4">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-6">
        <h1 class="text-xl font-bold text-center text-slate-800 mb-6">學生社團志願選填系統</h1>

        <!-- 步驟 1：選擇班級 -->
        <div id="stepClass">
            <h2 class="text-base font-semibold text-slate-700 mb-4 text-center">請選擇班級</h2>
            <div id="classGrid" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- 步驟 2：選擇學生卡片 -->
        <div id="stepStudent" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <button onclick="goBackToClass()" class="text-sm text-blue-600 underline">← 重選班級</button>
                <h2 id="selectedClassTitle" class="text-base font-semibold text-slate-700"></h2>
                <div></div>
            </div>
            <div id="studentGrid" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- 步驟 3：社團排序區 -->
        <div id="stepClub" class="hidden">
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-4">
                <div class="flex justify-between items-center mb-1">
                    <span id="studentInfo" class="font-bold text-blue-900 text-lg"></span>
                    <button onclick="goBackToStudent()" class="text-xs text-blue-600 underline">切換學生</button>
                </div>
                <span id="levelBadge" class="inline-block bg-blue-200 text-blue-800 text-xs px-2 py-0.5 rounded-full font-semibold"></span>
            </div>

            <p class="text-xs text-slate-500 mb-3 text-center">💡 點擊社團可檢視詳細簡介，上下拖曳可調整志願順序（最上方為第一志願）</p>

            <ul id="clubList" class="space-y-2 mb-6"></ul>

            <div class="flex flex-col sm:flex-row gap-3">
                <button onclick="submitData()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow transition">
                    提交志願
                </button>
                <button onclick="exportCSV()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow transition">
                    匯出 CSV 檔
                </button>
            </div>
        </div>
    </div>

    <!-- 彈出視窗 (社團簡介 Dialog) -->
    <div id="descModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <h3 id="modalTitle" class="text-xl font-bold text-slate-800 mb-3 border-b pb-2"></h3>
            <p id="modalDesc" class="text-slate-600 text-sm leading-relaxed mb-6 whitespace-pre-line"></p>
            <button onclick="closeModal()" class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl hover:bg-slate-700 transition">
                了解，關閉視窗
            </button>
        </div>
    </div>

    <script>
        // ⚠️ 請在此處貼上您的 Google Apps Script Web App URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwysSOartamBcSLu63YM0ZDVBHF9SU4ZhjA3yCYXK302LTvAtgRLqh4xEiP0yhHcxZxHg/exec";

        let allStudents = [];
        let allClubs = [];
        let currentStudent = null;
        let sortableInstance = null;

        // 初始化：從 Google Sheet 取得學生與社團資料
        window.onload = async () => {
            if (GAS_URL && GAS_URL !== "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE") {
                try {
                    const res = await fetch(GAS_URL);
                    const data = await res.json();
                    allStudents = data.students;
                    allClubs = data.clubs;
                    renderClasses();
                } catch (e) {
                    alert('資料載入失敗，請檢查 Google Apps Script 網址或網路狀況。');
                }
            } else {
                alert('請先在 index.html 填入您的 Google Apps Script URL！');
            }
        };

        function renderClasses() {
            const classGrid = document.getElementById('classGrid');
            const classes = [...new Set(allStudents.map(s => s.className))];
            
            classGrid.innerHTML = '';
            classes.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "class-btn py-5 rounded-2xl text-2xl font-bold shadow-md transition active:scale-95";
                btn.innerText = c;
                btn.onclick = () => selectClass(c);
                classGrid.appendChild(btn);
            });
        }

        function selectClass(c) {
            document.getElementById('stepClass').classList.add('hidden');
            document.getElementById('stepStudent').classList.remove('hidden');
            document.getElementById('selectedClassTitle').innerText = `${c} 班學生名單`;
            renderStudents(c);
        }

        function renderStudents(c) {
            const studentGrid = document.getElementById('studentGrid');
            const students = allStudents.filter(s => s.className === c);

            studentGrid.innerHTML = '';
            students.forEach(s => {
                const card = document.createElement('div');
                card.className = "bg-orange-50/50 border-2 border-orange-100 p-4 rounded-2xl text-center shadow-sm cursor-pointer hover:border-orange-300 active:scale-95 transition";
                card.onclick = () => selectStudent(s);
                card.innerHTML = `
                    <div class="text-slate-400 font-semibold text-lg mb-1">${s.seatNumber}號</div>
                    <div class="text-slate-800 font-bold text-2xl">${s.name}</div>
                `;
                studentGrid.appendChild(card);
            });
        }

        function selectStudent(student) {
            currentStudent = student;
            document.getElementById('stepStudent').classList.add('hidden');
            document.getElementById('stepClub').classList.remove('hidden');
            
            document.getElementById('studentInfo').innerText = `${student.className}班 ${student.seatNumber}號 ${student.name}`;
            document.getElementById('levelBadge').innerText = student.level;

            renderClubs(student.level);
        }

        function renderClubs(level) {
            const clubListEl = document.getElementById('clubList');
            clubListEl.innerHTML = '';

            const filtered = allClubs.filter(c => c.target === level);
            filtered.forEach((club, index) => {
                const li = document.createElement('li');
                li.className = "bg-white p-3 border border-slate-200 rounded-xl shadow-sm flex items-center justify-between cursor-move hover:border-blue-400 transition";
                li.setAttribute('data-id', club.id);
                li.setAttribute('data-name', club.name);
                
                // 簡短顯示前 15 個字
                const shortDesc = club.desc ? (club.desc.length > 15 ? club.desc.substring(0, 15) + "..." : club.desc) : "點擊查看詳情";

                li.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <span class="rank-num bg-blue-100 text-blue-800 font-bold px-2.5 py-1 rounded-lg text-sm flex-shrink-0">${index + 1}</span>
                        <div class="truncate">
                            <span class="font-bold text-slate-800">[${club.id}] ${club.name}</span>
                            <p class="text-xs text-slate-500 truncate">${shortDesc}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 flex-shrink-0">
                        <button onclick="showModal('${club.name}', \`${club.desc}\`)" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 font-semibold px-2 py-1 rounded-md transition">
                            ℹ️ 簡介
                        </button>
                        <span class="text-slate-300">☰</span>
                    </div>
                `;
                clubListEl.appendChild(li);
            });

            if (sortableInstance) sortableInstance.destroy();
            sortableInstance = new Sortable(clubListEl, {
                animation: 150,
                onEnd: () => {
                    document.querySelectorAll('#clubList li').forEach((item, idx) => {
                        item.querySelector('.rank-num').textContent = idx + 1;
                    });
                }
            });
        }

        // 顯示社團詳細簡介
        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc || "暫無詳細簡介。";
            document.getElementById('descModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('descModal').classList.add('hidden');
        }

        function goBackToClass() {
            document.getElementById('stepStudent').classList.add('hidden');
            document.getElementById('stepClass').classList.remove('hidden');
        }

        function goBackToStudent() {
            document.getElementById('stepClub').classList.add('hidden');
            document.getElementById('stepStudent').classList.remove('hidden');
        }

        async function submitData() {
            if (!currentStudent) return;
            const preferences = getPreferences();

            const payload = {
                className: currentStudent.className,
                seatNumber: currentStudent.seatNumber,
                studentName: currentStudent.name,
                level: currentStudent.level,
                preferences: preferences
            };

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('志願提交成功！已寫入 Google Sheet。');
            } catch (e) {
                alert('提交失敗：' + e);
            }
        }

        function exportCSV() {
            if (!currentStudent) return;
            const preferences = getPreferences();

            let csv = "\uFEFF班級,座號,姓名,學制分組,志願序號,社團內容\n";
            preferences.forEach(p => {
                csv += `"${currentStudent.className}","${currentStudent.seatNumber}","${currentStudent.name}","${currentStudent.level}","${p}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${currentStudent.className}_${currentStudent.seatNumber}_${currentStudent.name}_社團志願.csv`;
            link.click();
        }

        function getPreferences() {
            const items = document.querySelectorAll('#clubList li');
            let prefs = [];
            items.forEach((item, index) => {
                prefs.push(`志願${index + 1}: [${item.getAttribute('data-id')}] ${item.getAttribute('data-name')}`);
            });
            return prefs;
        }
    </script>
</body>
</html>
