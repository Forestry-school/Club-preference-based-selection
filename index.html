<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115學年度 第一學期 線上選社志願序</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        *{ font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif; }
        body{ background: #FFF9F2; color: #4A3E3D; }

        .app-card {
            background: #FFFFFF; border: 4px solid #FFE4C4;
            border-radius: 32px; box-shadow: 0 12px 0 #FCE2C2;
        }

        .header-box {
            background: #FF9F43; border-radius: 24px; color: white;
            padding: 20px 16px; text-align: center; box-shadow: 0 6px 0 #E07A1A;
        }

        .trail-dot {
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; border: 3px solid #FFE0B2; background: #FFF;
            color: #FF9F43; font-weight: 900; transition: .2s ease;
        }
        .trail-dot.active { background: #FF9F43; border-color: #FF9F43; color: #FFF; transform: scale(1.1); }
        .trail-dot.done { background: #FFC048; border-color: #FFC048; color: #FFF; }
        .trail-label { font-size: 13px; color: #B38F7A; font-weight: 900; }
        .trail-label.active { color: #E07A1A; }
        .trail-line { width: 32px; height: 4px; background: #FFE0B2; border-radius: 4px; margin-bottom: 20px; }
        .trail-line.done { background: #FFC048; }

        .class-btn {
            background: #FF9F43; color: white; border-radius: 20px;
            padding: 20px 10px; font-size: 1.5rem; font-weight: 900;
            box-shadow: 0 6px 0 #E07A1A; transition: .1s ease; border: none;
        }
        .class-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #E07A1A; }

        .student-card {
            background: #FFF0F5; border: 3px solid #FFD1DC;
            border-radius: 20px; padding: 16px 10px; text-align: center;
            cursor: pointer; box-shadow: 0 5px 0 #FFC0CB; transition: .1s ease;
        }
        .student-card:active { transform: translateY(3px); box-shadow: 0 2px 0 #FFC0CB; }

        .club-row {
            background: #FFF; border: 3px solid #F0E6DF;
            border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .club-row.rank-1 { border-color: #FF9F43; background: #FFFBF5; }
        .club-row.rank-2 { border-color: #54A0FF; background: #F5F9FF; }
        .club-row.rank-3 { border-color: #5F27CD; background: #F8F5FF; }

        .rank-select {
            background: #FFF; border: 2px solid #FF9F43; color: #E07A1A;
            font-weight: 900; font-size: 14px; border-radius: 12px; padding: 6px 10px;
        }
        .info-chip {
            background: #FF6B6B; color: #FFF; font-weight: 900; font-size: 13px;
            padding: 6px 12px; border-radius: 12px; box-shadow: 0 3px 0 #EE5253;
        }

        .btn-submit {
            background: #10AC84; color: white; font-weight: 900; font-size: 1.2rem;
            padding: 16px; border-radius: 20px; box-shadow: 0 6px 0 #0E8667;
        }
        .btn-submit:active { transform: translateY(4px); box-shadow: 0 2px 0 #0E8667; }

        .status-box { border: 3px dashed #FFD1DC; border-radius: 20px; padding: 24px; text-align: center; color: #A88; }
        .status-box.error { border-color: #FF6B6B; background: #FFEAEA; color: #EE5253; }
    </style>
</head>
<body class="py-8 px-4">
    <div class="max-w-xl mx-auto app-card p-6 sm:p-8">
        
        <!-- Banner -->
        <div class="header-box mb-6">
            <img id="schoolLogo" src="logo.png" alt="學校Logo" class="mx-auto h-14 mb-2 object-contain" onerror="this.style.display='none'">
            <h2 class="text-2xl font-black">115學年度 第一學期</h2>
            <h3 class="text-base font-bold opacity-90">🎈 線上選社志願序 🎈</h3>
        </div>

        <!-- 步驟軌跡 -->
        <div class="trail" id="trail">
            <div class="flex flex-col items-center gap-1">
                <div class="trail-dot active" id="dotClass">1</div>
                <span class="trail-label active" id="labelClass">選班級</span>
            </div>
            <div class="trail-line" id="lineOne"></div>
            <div class="flex flex-col items-center gap-1">
                <div class="trail-dot" id="dotStudent">2</div>
                <span class="trail-label" id="labelStudent">選同學</span>
            </div>
            <div class="trail-line" id="lineTwo"></div>
            <div class="flex flex-col items-center gap-1">
                <div class="trail-dot" id="dotClub">3</div>
                <span class="trail-label" id="labelClub">排志願</span>
            </div>
        </div>

        <!-- 步驟 1 -->
        <div id="stepClass">
            <h3 class="font-black text-center text-base text-amber-900 mb-4">👇 請點選班級</h3>
            <div id="classGrid" class="grid grid-cols-2 gap-4">
                <div class="status-box col-span-2">📡 資料載入中，請稍候…</div>
            </div>
        </div>

        <!-- 步驟 2 -->
        <div id="stepStudent" class="hidden">
            <div class="text-center mb-4">
                <h3 id="selectedClassTitle" class="font-black text-center text-lg text-amber-900"></h3>
            </div>
            <div id="studentGrid" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- 步驟 3 -->
        <div id="stepClub" class="hidden">
            <div class="bg-amber-100 border-2 border-amber-300 rounded-2xl p-4 mb-4">
                <div class="flex justify-between items-center mb-1">
                    <span id="studentInfo" class="font-black text-xl text-amber-950"></span>
                    <button onclick="restartProcess()" class="text-xs bg-white text-amber-800 font-bold px-3 py-1 rounded-xl border border-amber-300">重新選擇</button>
                </div>
                <span id="levelBadge" class="inline-block bg-amber-500 text-white font-bold text-xs px-3 py-0.5 rounded-full"></span>
            </div>

            <p class="text-xs text-amber-800 font-bold mb-4 text-center">💡 請選擇志願號碼（1 為最想上的社團）</p>

            <div id="clubList" class="space-y-3 mb-6"></div>

            <button onclick="submitData()" class="w-full btn-submit">
                送出志願！
            </button>
        </div>

        <footer class="text-center text-amber-700/50 font-bold text-xs mt-8">國小社團選填系統</footer>
    </div>

    <!-- Modal -->
    <div id="descModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl border-4 border-amber-300 max-w-md w-full p-6 shadow-2xl">
            <h3 id="modalTitle" class="text-xl font-black mb-3 border-b-2 border-amber-200 pb-2 text-amber-900"></h3>
            <p id="modalDesc" class="text-sm font-bold leading-relaxed mb-6 text-slate-600 whitespace-pre-line"></p>
            <button onclick="closeModal()" class="w-full bg-amber-500 text-white font-black py-3 rounded-2xl shadow-md">
                知道囉！關閉
            </button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwysSOartamBcSLu63YM0ZDVBHF9SU4ZhjA3yCYXK302LTvAtgRLqh4xEiP0yhHcxZxHg/exec";

        let allStudents = [];
        let allClubs = [];
        let existingRecords = {};
        let currentStudent = null;
        let currentFilteredClubs = [];

        window.onload = () => { loadData(); };

        async function loadData() {
            const classGrid = document.getElementById('classGrid');
            classGrid.innerHTML = '<div class="status-box col-span-2">📡 資料載入中，請稍候…</div>';

            if (!GAS_URL) {
                classGrid.innerHTML = '<div class="status-box error col-span-2">尚未設定資料來源網址（GAS_URL）</div>';
                return;
            }

            try {
                const res = await fetch(GAS_URL);
                if (!res.ok) throw new Error('伺服器回應錯誤');

                let data = await res.json();
                allStudents = data.students || [];
                allClubs = data.clubs || [];
                existingRecords = data.existingRecords || {};

                if (allStudents.length === 0) {
                    classGrid.innerHTML = '<div class="status-box col-span-2">目前查無學生名單<br><button class="mt-2 text-xs bg-amber-500 text-white px-3 py-1 rounded-xl" onclick="loadData()">重新載入</button></div>';
                    return;
                }

                renderClasses();
            } catch (e) {
                classGrid.innerHTML = '<div class="status-box error col-span-2">⚠️ 資料載入失敗<br>' + (e.message || '請檢查網路連線') + '<br><button class="mt-2 text-xs bg-red-500 text-white px-3 py-1 rounded-xl" onclick="loadData()">重新載入</button></div>';
            }
        }

        function setTrail(step) {
            const dots = { 1: 'dotClass', 2: 'dotStudent', 3: 'dotClub' };
            const labels = { 1: 'labelClass', 2: 'labelStudent', 3: 'labelClub' };
            [1, 2, 3].forEach(i => {
                const dot = document.getElementById(dots[i]);
                const label = document.getElementById(labels[i]);
                dot.classList.remove('active', 'done');
                label.classList.remove('active');
                if (i < step) dot.classList.add('done');
                else if (i === step) { dot.classList.add('active'); label.classList.add('active'); }
            });
            document.getElementById('lineOne').classList.toggle('done', step > 1);
            document.getElementById('lineTwo').classList.toggle('done', step > 2);
        }

        function renderClasses() {
            const classGrid = document.getElementById('classGrid');
            const classes = [...new Set(allStudents.map(s => s.className))];

            classGrid.innerHTML = '';
            classes.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "class-btn";
                btn.innerText = c;
                btn.onclick = () => selectClass(c);
                classGrid.appendChild(btn);
            });
        }

        function selectClass(c) {
            document.getElementById('stepClass').classList.add('hidden');
            document.getElementById('stepStudent').classList.remove('hidden');
            document.getElementById('selectedClassTitle').innerText = `${c} 班學生名單`;
            setTrail(2);
            renderStudents(c);
        }

        function renderStudents(c) {
            const studentGrid = document.getElementById('studentGrid');
            const students = allStudents.filter(s => s.className === c);

            studentGrid.innerHTML = '';
            students.forEach(s => {
                const card = document.createElement('div');
                card.className = "student-card";
                card.onclick = () => selectStudent(s);
                card.innerHTML = `
                    <div class="text-pink-400 font-bold text-xs mb-1">${s.seatNumber}號</div>
                    <div class="text-slate-800 font-black text-2xl">${s.name}</div>
                `;
                studentGrid.appendChild(card);
            });
        }

        function selectStudent(student) {
            currentStudent = student;
            document.getElementById('stepStudent').classList.add('hidden');
            document.getElementById('stepClub').classList.remove('hidden');
            setTrail(3);

            document.getElementById('studentInfo').innerText = `${student.className}班 ${student.seatNumber}號 ${student.name}`;
            document.getElementById('levelBadge').innerText = student.level;

            const studentKey = `${student.className}_${student.seatNumber}`;
            const pastRecord = existingRecords[studentKey] || {};

            const clubsForLevel = allClubs.filter(c => c.target === student.level);

            currentFilteredClubs = clubsForLevel.map((club, idx) => {
                const savedRank = pastRecord[club.name] ? parseInt(pastRecord[club.name]) : (idx + 1);
                return { ...club, rank: savedRank };
            });

            renderClubs();
        }

        function renderClubs() {
            const clubListEl = document.getElementById('clubList');
            clubListEl.innerHTML = '';

            const totalClubs = currentFilteredClubs.length;
            currentFilteredClubs.sort((a, b) => a.rank - b.rank);

            currentFilteredClubs.forEach((club) => {
                const item = document.createElement('div');
                const rankClass = club.rank === 1 ? 'rank-1' : club.rank === 2 ? 'rank-2' : club.rank === 3 ? 'rank-3' : '';
                item.className = `club-row ${rankClass}`;

                const shortDesc = club.desc ? (club.desc.length > 12 ? club.desc.substring(0, 12) + "..." : club.desc) : "點擊查看詳情";

                let optionsHtml = '';
                for (let i = 1; i <= totalClubs; i++) {
                    const selected = (i === club.rank) ? 'selected' : '';
                    optionsHtml += `<option value="${i}" ${selected}>第 ${i} 志願</option>`;
                }

                item.innerHTML = `
                    <div class="flex items-center space-x-2 overflow-hidden flex-1">
                        <select onchange="changeRank('${club.id}', this.value)" class="rank-select">
                            ${optionsHtml}
                        </select>
                        <div class="truncate">
                            <span class="font-black text-slate-800 text-sm sm:text-base">[${club.id}] ${club.name}</span>
                            <p class="text-xs text-slate-400 font-bold truncate">${shortDesc}</p>
                        </div>
                    </div>
                    <button onclick="showModal('${club.name}', \`${club.desc}\`)" class="info-chip flex-shrink-0">
                        ℹ️ 簡介
                    </button>
                `;
                clubListEl.appendChild(item);
            });
        }

        function changeRank(clubId, newRank) {
            newRank = parseInt(newRank);
            const targetClub = currentFilteredClubs.find(c => c.id === clubId);
            const oldRank = targetClub.rank;

            if (oldRank === newRank) return;

            const replacedClub = currentFilteredClubs.find(c => c.rank === newRank);
            if (replacedClub) {
                replacedClub.rank = oldRank;
            }
            targetClub.rank = newRank;

            renderClubs();
        }

        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc || "暫無詳細簡介。";
            document.getElementById('descModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('descModal').classList.add('hidden');
        }

        function restartProcess() {
            document.getElementById('stepClub').classList.add('hidden');
            document.getElementById('stepStudent').classList.add('hidden');
            document.getElementById('stepClass').classList.remove('hidden');
            setTrail(1);
            currentStudent = null;
        }

        async function submitData() {
            if (!currentStudent) return;

            const preferencesPayload = currentFilteredClubs.map(c => ({
                clubName: c.name,
                rank: c.rank
            }));

            const payload = {
                className: currentStudent.className,
                seatNumber: currentStudent.seatNumber,
                studentName: currentStudent.name,
                level: currentStudent.level,
                preferences: preferencesPayload
            };

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('志願提交/更新成功！已寫入資料庫。');

                const studentKey = `${currentStudent.className}_${currentStudent.seatNumber}`;
                if (!existingRecords[studentKey]) existingRecords[studentKey] = {};
                currentFilteredClubs.forEach(c => {
                    existingRecords[studentKey][c.name] = c.rank;
                });

            } catch (e) {
                alert('提交失敗：' + e);
            }
        }
    </script>
</body>
</html>
