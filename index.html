<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>115學年度 第一學期 線上選社志願序</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .class-btn { background-color: #4d7c0f; color: white; }
        .class-btn:hover { background-color: #3f6212; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-6 px-4">
    <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-6">
        
        <!-- 頂部 Logo 與標頭區 -->
        <div class="text-center mb-6">
            <img id="schoolLogo" src="logo.png" alt="學校Logo" class="mx-auto h-20 mb-3 object-contain">
            <h1 class="text-xl sm:text-2xl font-bold text-slate-800">115學年度 第一學期</h1>
            <h2 class="text-lg font-semibold text-slate-600 mt-1">線上選社志願序</h2>
        </div>

        <hr class="border-slate-200 mb-6">

        <!-- 步驟 1：選擇班級 -->
        <div id="stepClass">
            <h3 class="text-base font-semibold text-slate-700 mb-4 text-center">請選擇班級</h3>
            <div id="classGrid" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- 步驟 2：選擇學生卡片 -->
        <div id="stepStudent" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <button onclick="goBackToClass()" class="text-sm text-blue-600 underline">← 重選班級</button>
                <h3 id="selectedClassTitle" class="text-base font-semibold text-slate-700"></h3>
                <div></div>
            </div>
            <div id="studentGrid" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- 步驟 3：社團選擇區 -->
        <div id="stepClub" class="hidden">
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 mb-4">
                <div class="flex justify-between items-center mb-1">
                    <span id="studentInfo" class="font-bold text-blue-900 text-lg"></span>
                    <button onclick="goBackToStudent()" class="text-xs text-blue-600 underline">切換學生</button>
                </div>
                <span id="levelBadge" class="inline-block bg-blue-200 text-blue-800 text-xs px-2 py-0.5 rounded-full font-semibold"></span>
            </div>

            <p class="text-xs text-slate-500 mb-3 text-center">💡 請為每個社團選擇志願序號（數字 1 為第一志願），點擊 ℹ️ 可查看簡介</p>

            <div id="clubList" class="space-y-3 mb-6"></div>

            <button onclick="submitData()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow transition text-lg">
                提交 / 更新志願
            </button>
        </div>
    </div>

    <!-- 彈出視窗 (社團簡介 Dialog) -->
    <div id="descModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <h3 id="modalTitle" class="text-xl font-bold text-slate-800 mb-3 border-b pb-2"></h3>
            <p id="modalDesc" class="text-slate-600 text-sm leading-relaxed mb-6 whitespace-pre-line"></p>
            <button onclick="closeModal()" class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl hover:bg-slate-700 transition">
                了解，關閉視窗
            </button>
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwysSOartamBcSLu63YM0ZDVBHF9SU4ZhjA3yCYXK302LTvAtgRLqh4xEiP0yhHcxZxHg/exec";

        let allStudents = [];
        let allClubs = [];
        let existingRecords = {};
        let currentStudent = null;
        let currentFilteredClubs = [];

        window.onload = async () => {
            if (GAS_URL) {
                try {
                    const res = await fetch(GAS_URL);
                    const data = await res.json();
                    allStudents = data.students || [];
                    allClubs = data.clubs || [];
                    existingRecords = data.existingRecords || {};
                    renderClasses();
                } catch (e) {
                    alert('資料載入失敗，請檢查網路狀態。');
                }
            }
        };

        function renderClasses() {
            const classGrid = document.getElementById('classGrid');
            const classes = [...new Set(allStudents.map(s => s.className))];
            
            classGrid.innerHTML = '';
            if(classes.length === 0) {
                classGrid.innerHTML = '<p class="col-span-2 text-center text-slate-400 py-4">讀取中或尚未有學生資料...</p>';
                return;
            }

            classes.forEach(c => {
                const btn = document.createElement('button');
                btn.className = "class-btn py-5 rounded-2xl text-2xl font-bold shadow-md transition active:scale-95";
                btn.innerText = c;
                btn.onclick = () => selectClass(c);
                classGrid.appendChild(btn);
            });
        }

        function selectClass(c) {
            document.getElementById('stepClass').classList.add('hidden');
            document.getElementById('stepStudent').classList.remove('hidden');
            document.getElementById('selectedClassTitle').innerText = `${c} 班學生名單`;
            renderStudents(c);
        }

        function renderStudents(c) {
            const studentGrid = document.getElementById('studentGrid');
            const students = allStudents.filter(s => s.className === c);

            studentGrid.innerHTML = '';
            students.forEach(s => {
                const card = document.createElement('div');
                card.className = "bg-orange-50/50 border-2 border-orange-100 p-4 rounded-2xl text-center shadow-sm cursor-pointer hover:border-orange-300 active:scale-95 transition";
                card.onclick = () => selectStudent(s);
                card.innerHTML = `
                    <div class="text-slate-400 font-semibold text-lg mb-1">${s.seatNumber}號</div>
                    <div class="text-slate-800 font-bold text-2xl">${s.name}</div>
                `;
                studentGrid.appendChild(card);
            });
        }

        function selectStudent(student) {
            currentStudent = student;
            document.getElementById('stepStudent').classList.add('hidden');
            document.getElementById('stepClub').classList.remove('hidden');
            
            document.getElementById('studentInfo').innerText = `${student.className}班 ${student.seatNumber}號 ${student.name}`;
            document.getElementById('levelBadge').innerText = student.level;

            // 檢查該生先前是否有填過紀錄
            const studentKey = `${student.className}_${student.seatNumber}`;
            const pastRecord = existingRecords[studentKey] || {};

            // 篩選出該學制社團
            const clubsForLevel = allClubs.filter(c => c.target === student.level);

            currentFilteredClubs = clubsForLevel.map((club, idx) => {
                // 如果先前有紀錄就帶入，否則預設 1, 2, 3...
                const savedRank = pastRecord[club.name] ? parseInt(pastRecord[club.name]) : (idx + 1);
                return {
                    ...club,
                    rank: savedRank
                };
            });

            renderClubs();
        }

        function renderClubs() {
            const clubListEl = document.getElementById('clubList');
            clubListEl.innerHTML = '';

            const totalClubs = currentFilteredClubs.length;
            currentFilteredClubs.sort((a, b) => a.rank - b.rank);

            currentFilteredClubs.forEach((club) => {
                const item = document.createElement('div');
                item.className = "bg-white p-3 border border-slate-200 rounded-xl shadow-sm flex items-center justify-between gap-2";
                
                const shortDesc = club.desc ? (club.desc.length > 12 ? club.desc.substring(0, 12) + "..." : club.desc) : "點擊查看詳情";

                let optionsHtml = '';
                for (let i = 1; i <= totalClubs; i++) {
                    const selected = (i === club.rank) ? 'selected' : '';
                    optionsHtml += `<option value="${i}" ${selected}>第 ${i} 志願</option>`;
                }

                item.innerHTML = `
                    <div class="flex items-center space-x-2 overflow-hidden flex-1">
                        <select onchange="changeRank('${club.id}', this.value)" class="bg-blue-50 border border-blue-300 text-blue-900 font-bold text-sm rounded-lg p-2 focus:ring-2 focus:ring-blue-500">
                            ${optionsHtml}
                        </select>
                        <div class="truncate">
                            <span class="font-bold text-slate-800 text-sm sm:text-base">[${club.id}] ${club.name}</span>
                            <p class="text-xs text-slate-500 truncate">${shortDesc}</p>
                        </div>
                    </div>
                    <button onclick="showModal('${club.name}', \`${club.desc}\`)" class="text-xs bg-amber-100 hover:bg-amber-200 text-amber-800 font-semibold px-2.5 py-1.5 rounded-md transition flex-shrink-0">
                        ℹ️ 簡介
                    </button>
                `;
                clubListEl.appendChild(item);
            });
        }

        function changeRank(clubId, newRank) {
            newRank = parseInt(newRank);
            const targetClub = currentFilteredClubs.find(c => c.id === clubId);
            const oldRank = targetClub.rank;

            if (oldRank === newRank) return;

            const replacedClub = currentFilteredClubs.find(c => c.rank === newRank);
            if (replacedClub) {
                replacedClub.rank = oldRank;
            }
            targetClub.rank = newRank;

            renderClubs();
        }

        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc || "暫無詳細簡介。";
            document.getElementById('descModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('descModal').classList.add('hidden');
        }

        function goBackToClass() {
            document.getElementById('stepStudent').classList.add('hidden');
            document.getElementById('stepClass').classList.remove('hidden');
        }

        function goBackToStudent() {
            document.getElementById('stepClub').classList.add('hidden');
            document.getElementById('stepStudent').classList.remove('hidden');
        }

        async function submitData() {
            if (!currentStudent) return;

            // 打包成 [{clubName: '直排輪', rank: 1}, ...]
            const preferencesPayload = currentFilteredClubs.map(c => ({
                clubName: c.name,
                rank: c.rank
            }));

            const payload = {
                className: currentStudent.className,
                seatNumber: currentStudent.seatNumber,
                studentName: currentStudent.name,
                level: currentStudent.level,
                preferences: preferencesPayload
            };

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                alert('志願提交/更新成功！已覆蓋更新至 Excel 試算表。');
                
                // 本地更新紀錄，方便不刷新即可再次點選
                const studentKey = `${currentStudent.className}_${currentStudent.seatNumber}`;
                if (!existingRecords[studentKey]) existingRecords[studentKey] = {};
                currentFilteredClubs.forEach(c => {
                    existingRecords[studentKey][c.name] = c.rank;
                });

            } catch (e) {
                alert('提交失敗：' + e);
            }
        }
    </script>
</body>
</html>
